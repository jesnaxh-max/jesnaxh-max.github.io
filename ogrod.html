<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Ogród - Smart Home</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="images/logo.jpg">
</head>
<body class="room ogrod-bg">

<header class="frosted">
    <img src="images/logo.jpg" class="logo">
    <h1>Ogród</h1>
    <nav><a href="index.html">Powrót</a></nav>
</header>

<div class="panel">
    <h2>Ustawienia Ogrodu</h2>

    <div class="control">
        <h3>Oświetlenie</h3>
        <button class="toggle-btn">Włącz światło</button>
    </div>

    <div class="control temp-control">
        <h3>Temperatura</h3>
        <input type="range" min="10" max="35" value="20" class="temp-slider" id="temperatureSlider">
        <p class="temp-display" id="tempDisplay">20°C</p>
    </div>

    <button class="btn-confirm" id="confirmButton">Zatwierdź</button>
    <div class="estimated-time" id="estimatedTime"></div>

    <div class="control">
        <h3>Podlewanie</h3>
        <button class="toggle-btn">Włącz podlewanie</button>
    </div>
</div>

<script src="script.js"></script>
<script>
function logout(){
    localStorage.removeItem("logged");
    window.location.href = "login.html";
}
</script>
</body>
</html>
