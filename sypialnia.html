<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sypialnia - Smart Home</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="images/logo.jpg">
</head>
<body class="room sypialnia-bg">

<header class="frosted">
    <img src="images/logo.jpg" class="logo">
    <h1>Sypialnia</h1>
    <nav><a href="index.html">Powrót</a></nav>
</header>
<br>
<br>
<div class="panel animated-panel">
    <h2>Ustawienia Sypialni</h2>

    <div class="control">
        <h3>Oświetlenie</h3>
        <button class="toggle-btn">Włącz światło</button>
    </div>

    <div class="control temp-control">
        <h3>Temperatura</h3>
        <input type="range" min="15" max="30" value="20" class="temp-slider" id="temperatureSlider">
        <p class="temp-display" id="tempDisplay">20°C</p>
    </div>

    <button class="btn-confirm" id="confirmButton">Zatwierdź</button>
    <div class="estimated-time" id="estimatedTime"></div>

    <div class="control">
        <h3>Zasłony</h3>
        <button class="toggle-btn">Zasłoń zasłony</button>
    </div>

</div>

<script src="script.js"></script>
<script>
function logout(){
    localStorage.removeItem("logged");
    window.location.href = "login.html";
}
</script>
</body>
</html>
